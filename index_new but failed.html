<style>

#vp.pass #vs{background:#3ed598;color:#062a1c}#vp.fail #vs{background:#ff7a72;color:#3a0a07}

<body>
<div class="wrap" id="app"><p class="mute">불러오는 중…</p></div>
<div id="proj"><button id="pc">닫기 (Esc)</button><div class="ph"><div class="pt" id="pt"></div><div id="pk"><b id="pkt"></b><small id="pkd"></small></div></div>
  <div class="pn"><b id="pa">0</b><span>명 출석</span><small id="pe"></small></div>
  <div class="pbar"><i id="pf" style="width:0"></i><u id="pm" style="left:50%;text-decoration:none"><b id="pml"></b></u></div>
  <div id="ps"></div><div id="pr"></div><div id="pv"></div>
  <div id="pctl"><span>의결 방식</span><button data-m="maj">과반수</button><button data-m="two">3분의 2</button><span class="sp"></span>
    <span>찬성</span><button data-a="-">−</button><b id="vc">0</b><button data-a="+">＋</button><button data-a="0">초기화</button></div></div>
<div id="vp"><button id="vc2">닫기 (Esc)</button>
  <div><div id="vt"></div><div id="vm"></div></div>
  <div class="vbody"><div class="vqr"><div id="vqr"></div>QR을 비춰 투표하세요</div>
    <div class="vres"><div class="vrow y"><span>찬성</span><b id="vy">0</b><small id="vyn"></small></div><div class="vbar"><i id="vyb" style="width:0"></i><u id="vym"></u></div>
      <div class="vrow n"><span>반대</span><b id="vn">0</b><small id="vnn"></small></div><div class="vbar n"><i id="vnb" style="width:0"></i><u id="vnm"></u></div>
      <div id="vpt"></div></div></div>
  <div id="vs"></div><div id="vd"></div></div>
<div id="modal"><div id="qrbox"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getFirestore,collection,doc,getDoc,setDoc,addDoc,deleteDoc,getDocs,updateDoc,onSnapshot,query,orderBy,serverTimestamp,writeBatch}
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged}
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

/* ▼▼ Firebase 콘솔 > 프로젝트 설정 > 내 앱(웹)의 설정값으로 교체 ▼▼ */
const firebaseConfig={
const firebaseConfig={
  apiKey: "AIzaSyBCdPAcgpf-nFpriAh6xPcH9B6J2oacHzg",
  authDomain: "hufs-union-attendance.firebaseapp.com",
  projectId: "hufs-union-attendance",
  appId: "1:539700502440:web:7859b57b608737d0e5479d"
};
// 조합원 DB(Apps Script 웹앱) 주소: /exec 까지만 입력
const MEMBER_API="https://script.google.com/macros/s/AKfycbznLTBJQIn91BLU-wyCGpehykUlWM9Q7rsts5pHr9nA17qFMrMtWB3nxlY2P54jNyc/exec";
// 참석 명단에서 제외할 그룹(상태) 표기 — 필요하면 수정
const EXCLUDE_STATUS=["퇴직","자격정지"];
/* ▲▲ */

const app=initializeApp(firebaseConfig),db=getFirestore(app),auth=getAuth(app);
const $=s=>document.querySelector(s),root=$("#app");
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const sid=new URLSearchParams(location.search).get("s");

// 이름+전화번호 뒤 4자리 → 문서 ID(해시). 명단 목록을 공개하지 않고도 본인 확인이 가능
const normName=n=>String(n).replace(/\s+/g,"");
async function keyOf(s,name,last4,code=""){
  const b=new TextEncoder().encode(`${s}|${normName(name)}|${last4}`+(code?`|${code}`:""));
  const h=await crypto.subtle.digest("SHA-256",b);
  return [...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,"0")).join("");
}

/* ───────── 참석자 화면 (QR로 접속) ───────── */
async function attendee(){
  let title="총회",need=false;
  try{const s=await getDoc(doc(db,"sessions",sid));if(!s.exists())throw 0;title=s.data().title;need=!!s.data().needCode}
  catch{root.innerHTML=`<div class="card"><h1>유효하지 않은 QR입니다</h1><p class="mute">현장 안내자에게 문의해 주세요.</p></div>`;return}
  root.innerHTML=`<div class="card"><h1>${esc(title)}</h1><p class="mute">참석 확인을 위해 아래 정보를 입력해 주세요.</p>
  <label for="n">이름</label><input id="n" autocomplete="name" placeholder="홍길동">
  <label for="p">전화번호 뒤 4자리</label><input id="p" inputmode="numeric" maxlength="4" pattern="[0-9]*" placeholder="1234">
  ${need?`<label for="c">이메일로 받은 인증번호 4자리</label><input id="c" inputmode="numeric" maxlength="4" pattern="[0-9]*" autocomplete="one-time-code">`:""}
  <button class="p big" id="go">참석 확인</button><div id="r"></div></div>`;
  $("#p").oninput=e=>e.target.value=e.target.value.replace(/\D/g,"");
  if(need)$("#c").oninput=e=>e.target.value=e.target.value.replace(/\D/g,"");
  $("#go").onclick=async()=>{
    const name=$("#n").value.trim(),p=$("#p").value,code=need?$("#c").value:"",r=$("#r");
    if(!name||p.length!==4||(need&&code.length!==4)){r.innerHTML=`<div class="msg no">${need?"이름, 전화번호 4자리, 인증번호 4자리를":"이름과 전화번호 4자리를 모두"} 입력해 주세요.</div>`;return}
    $("#go").disabled=true;
    try{
      const ref=doc(db,"sessions",sid,"members",await keyOf(sid,name,p,code)),s=await getDoc(ref);
      if(s.exists())try{localStorage.setItem("mid:"+sid,ref.id)}catch{}
      const vl=`<p style="margin-top:14px"><a href="?s=${sid}&v=1">투표 페이지로 이동 →</a></p>`;
      if(!s.exists())r.innerHTML=`<div class="msg no">명단에서 확인되지 않습니다. 입력한 정보를 다시 확인하거나 접수처에 문의해 주세요.</div>`;
      else if(s.data().checkedIn)r.innerHTML=`<div class="msg ok">${esc(s.data().name)}님은 이미 참석 확인되었습니다.</div>${vl}`;
      else{await updateDoc(ref,{checkedIn:true,checkedInAt:serverTimestamp()});
        r.innerHTML=`<div class="msg ok">${esc(s.data().name)}님, 참석 확인되었습니다.</div>${vl}`}
    }catch(e){r.innerHTML=`<div class="msg no">처리하지 못했습니다. 잠시 후 다시 시도해 주세요.</div>`}
    $("#go").disabled=false;
  };
}


/* ───────── 투표 화면 (QR로 접속) ───────── */
async function voter(){
  let title="총회",need=false;
  try{const t=await getDoc(doc(db,"sessions",sid));if(!t.exists())throw 0;title=t.data().title;need=!!t.data().needCode}
  catch{root.innerHTML=`<div class="card"><h1>유효하지 않은 QR입니다</h1></div>`;return}
  const verify=async id=>{try{const m=await getDoc(doc(db,"sessions",sid,"members",id));return m.exists()?m.data():null}catch{return null}};
  let mid=null;try{mid=localStorage.getItem("mid:"+sid)}catch{}
  const me=mid?await verify(mid):null;
  if(me&&me.checkedIn)return start(mid,me);
  root.innerHTML=`<div class="card"><h1>${esc(title)}</h1><p class="mute">투표 전, 본인 확인을 해 주세요. (참석 확인을 마친 분만 투표할 수 있습니다)</p>
    <label for="n">이름</label><input id="n" autocomplete="name"><label for="p">전화번호 뒤 4자리</label><input id="p" inputmode="numeric" maxlength="4">
    ${need?`<label for="c">이메일로 받은 인증번호 4자리</label><input id="c" inputmode="numeric" maxlength="4" autocomplete="one-time-code">`:""}
    <button class="p big" id="go">확인</button><div id="r"></div></div>`;
  $("#p").oninput=e=>e.target.value=e.target.value.replace(/\D/g,"");
  if(need)$("#c").oninput=e=>e.target.value=e.target.value.replace(/\D/g,"");
  $("#go").onclick=async()=>{
    const name=$("#n").value.trim(),p=$("#p").value,code=need?$("#c").value:"",r=$("#r");
    if(!name||p.length!==4||(need&&code.length!==4)){r.innerHTML=`<div class="msg no">${need?"이름, 전화번호 4자리, 인증번호 4자리를":"이름과 전화번호 4자리를"} 입력해 주세요.</div>`;return}
    const id=await keyOf(sid,name,p,code),m=await verify(id);

// 가결·부결 판정: 가결 = 찬성이 요건 이상, 부결 확정 = 남은 인원이 전부 찬성해도 요건에 못 미칠 때
function judge(ag,y,n){
  const b=ag.base||0,M=MODES[ag.mode]||MODES.maj,need=M.need(b),against=b-need+1,kind=ag.mode==="two"?"3분의 2 이상":"과반수";
  let st="go",msg="투표 진행 중",detail=`가결까지 찬성 ${Math.max(0,need-y)}표 더 필요 · 반대가 ${Math.max(0,against-n)}표 더 나오면 부결이 확정됩니다.`;
  if(ag.status==="ready"){msg="투표 대기";detail="투표가 시작되면 QR로 투표할 수 있습니다."}
  else if(b>0&&y>=need){st="pass";msg="가결";detail=`찬성 ${y}표로 의결 요건(찬성 ${need}표 이상)을 달성했습니다. 출석 ${b}명의 ${kind}이 찬성하여 가결이 확정되었습니다.`}
  else if(b>0&&n>=against){st="fail";msg="부결";detail=`반대 ${n}표로 부결이 확정되었습니다. 남은 인원이 모두 찬성해도 찬성은 최대 ${b-n}표로, 가결 요건(${need}표 이상)에 미달합니다.`}

}

/* 무결성: 종료 시점의 모든 표(문서ID·선택)를 정렬해 SHA-256 해시로 기록 → 이후 변경되면 검증에서 불일치 */
const sha=async t=>[...new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t)))].map(x=>x.toString(16).padStart(2,"0")).join("");
async function ballotDigest(a){
  const snap=await getDocs(collection(db,"sessions",cur,"agendas",a.id,"votes"));
  const v=snap.docs.map(d=>[d.id,d.data().c]).sort((x,y)=>x[0]<y[0]?-1:1),yes=v.filter(r=>r[1]==="y").length;
  return{yes,no:v.length-yes,digest:await sha(JSON.stringify({a:a.id,base:a.base,mode:a.mode,v}))};
}
async function closeAgenda(id){
  const a=agendas.find(x=>x.id===id);if(!a)return;
  await updateDoc(doc(db,"sessions",cur,"agendas",id),{status:"closed"});     // 1) 먼저 닫아 새 표를 막고
  const r=await ballotDigest(a);                                               // 2) 확정된 표로 집계·해시를 1회 기록
  await updateDoc(doc(db,"sessions",cur,"agendas",id),{yes:r.yes,no:r.no,digest:r.digest,closedAt:serverTimestamp()});
}
async function verifyAgenda(id){
  const a=agendas.find(x=>x.id===id);if(!a||!a.digest){alert("종료 시점의 해시 기록이 없습니다.");return}
  const r=await ballotDigest(a),ok=r.digest===a.digest&&r.yes===a.yes&&r.no===a.no;
  alert(ok?`✅ 일치합니다.\n종료 시점 기록(찬성 ${a.yes} · 반대 ${a.no})과 현재 저장된 표가 같습니다.\n해시: ${a.digest}`
    :`⚠ 불일치합니다!\n종료 시점: 찬성 ${a.yes} · 반대 ${a.no}\n현재: 찬성 ${r.yes} · 반대 ${r.no}\n저장된 표가 종료 이후 변경되었을 수 있습니다.`);
}

async function addMembers(list){
  const byId=new Map(members.map(m=>[m.id,m])),seen=new Set(byId.keys()),add=[],upd=[];let skip=0;
  for(const r of list){
    const name=String(r.name||"").trim(),last4=String(r.phone||"").replace(/\D/g,"").slice(-4),campus=String(r.campus||"").trim(),code=needCode()?String(r.code||""):"";
    if(!name||last4.length<4||(needCode()&&code.length!==4)){skip++;continue}
    const id=await keyOf(cur,name,last4,code);
    if(byId.has(id)){const o=byId.get(id);if(campus&&o.campus!==campus){upd.push({id,campus});o.campus=campus}continue}
    if(seen.has(id))continue;seen.add(id);
    add.push({id,name,dept:String(r.dept||"").trim(),campus});
  }
  if(!add.length&&!upd.length){alert(`추가하거나 갱신할 인원이 없습니다.${skip?` (형식 오류 ${skip}행 제외)`:""}`);return}
  if(!confirm(`${add.length}명을 추가하고, 기존 ${upd.length}명의 캠퍼스를 갱신합니다.${skip?`\n형식 오류로 제외된 행: ${skip}`:""}`))return;
  const ops=[...add.map(m=>({set:m})),...upd.map(u=>({upd:u}))];
  for(let i=0;i<ops.length;i+=400){
    const b=writeBatch(db);
    ops.slice(i,i+400).forEach(o=>{
      if(o.set)b.set(doc(db,"sessions",cur,"members",o.set.id),{name:o.set.name,dept:o.set.dept,campus:o.set.campus,checkedIn:false,checkedInAt:null});
      else b.update(doc(db,"sessions",cur,"members",o.upd.id),{campus:o.upd.campus});
    });
    await b.commit();
  }
  const f=$("#f");if(f)f.value="";
}

  const ws=XLSX.utils.json_to_sheet(members.map(m=>({이름:m.name,캠퍼스:m.campus||"",소속:m.dept||"",상태:m.checkedIn?"참석":"미참석",확인시각:m.checkedInAt?.toDate?m.checkedInAt.toDate().toLocaleString("ko-KR"):""})));
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"참석현황");
  XLSX.writeFile(wb,`${s.title}_참석현황.xlsx`);
}
